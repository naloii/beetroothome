<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catfolio</title>

    <link rel="stylesheet" href="styles.css" />

    <style>
        .main-page {
  width: 100%;
  background: linear-gradient(90deg, #b2d7fd 0%, #b6ffc6 92.79%);
        }
    </style>
    
</head>

<body>
    <section class="main-page">
    
        <header class="header">
         <h1>My catfolio</h1>
         <p>Maryna's cats</p>
        </header>

        <div class="profiles">
            <div class="catbox"; style="background-color: #fae5b8;">
                <h2 class="name" >
                    Shyshka
                </h2>
                <img src="imgs/Shysh.jpg" alt="Shysh-photo" class="Img">
                <p class="desc" style="text-align: left;"><b>Age:</b> 5 y.o.<br><b>Breed:</b> Stray mackerel<br><b>Traits:</b> affectionate, communicative, adventurous, self-confident</p>
            </div>
            <div class="catbox"; style="background-color: #b8faeb;">
                <h2 class="name">
                    Raphael
                </h2>
                <img src="imgs/Raf.jpg" alt="Raf-photo" class="Img">
                <p class="desc" style="text-align: left;"><b>Age:</b> 11 y.o.<br><b>Breed:</b> Scottish straight<br><b>Traits:</b> introvert, sleepy, picky eater, gentle, doesn't really understand Shyshka</p>
            </div>
        </div>
    </section>

    <footer id="footer" style="text-align: center; background-color: rgb(8, 73, 52); color: aliceblue;">&copy; 2026, Poltava</footer>
</body>
</html>
